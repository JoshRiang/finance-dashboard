[PHP]
; Opcache for the CLI SAPI. "php artisan serve" runs on the CLI SAPI, so
; without this every request re-reads and re-compiles every PHP file from
; the (slow) Windows bind mount.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.jit = off
opcache.jit_buffer_size = 0
opcache.save_comments = 1
opcache.fast_shutdown = 0

; Speed up stat() calls on the bind mount.
realpath_cache_size = 16M
realpath_cache_ttl = 600
